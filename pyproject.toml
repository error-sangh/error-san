[project]
name = "error-san"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "error-sangh", email = "sanjinomo7@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
error-san = "error_san:main"

[tool.maturin]
module-name = "error_san._core"
python-packages = ["error_san"]
python-source = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"
